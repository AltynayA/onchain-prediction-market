specVersion: 0.0.5
description: On-Chain Prediction Market subgraph — indexes market, trade, proposal and LP events
repository: https://github.com/AltynayA/onchain-prediction-market

schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: PredictionMarket
    network: base-sepolia
    source:
      address: "0x0cEC8fd1fD75bFe985807BeEEC1ACdaBE1784bB7"
      abi: PredictionMarket
      startBlock: 41580684
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Trade
      abis:
        - name: PredictionMarket
          file: ./abis/PredictionMarket.json
      eventHandlers:
        - event: MarketCreated(indexed uint256,string,uint256,address)
          handler: handleMarketCreated
        - event: SharesBought(indexed uint256,indexed address,bool,uint256,uint256)
          handler: handleSharesBought
        - event: MarketResolved(indexed uint256,bool,uint256)
          handler: handleMarketResolved
        - event: MarketFinalized(indexed uint256,bool)
          handler: handleMarketFinalized
        - event: SharesRedeemed(indexed uint256,indexed address,uint256,uint256)
          handler: handleSharesRedeemed
      file: ./src/prediction-market.ts